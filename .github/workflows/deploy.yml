name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 02:00 UTC on the 1st of each month — a couple of hours after the
    # access-worker's own Cron Trigger rotates each realm's content key (see
    # access-worker/wrangler.toml), so this rebuild always picks up that
    # month's new key even on a month with no content changes.
    - cron: '0 2 1 * *'

# Allow GITHUB_TOKEN to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress production deploy finish; queue at most one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Learn AAOS, SDV and tutorial article source lives in a separate
      # private repo (bhargavamandapati/aaos-premium-content) rather than
      # here, so that paywalled content isn't sitting in plaintext in this
      # public repo's git history. This checkout pulls it in read-only via a
      # deploy key scoped to that one repo, then the merge step below lays
      # it over this repo's own content/ directory before anything reads it.
      - name: Check out premium content
        uses: actions/checkout@v5
        with:
          repository: bhargavamandapati/aaos-premium-content
          ssh-key: ${{ secrets.PREMIUM_CONTENT_DEPLOY_KEY }}
          path: premium-content

      - name: Merge premium content into content/
        run: |
          mkdir -p content
          cp -r premium-content/content/. content/
          rm -rf premium-content

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve base path and site URL
        id: pages
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY%%/*}"

          # A custom domain always wins. public/CNAME is the single source of
          # truth, so canonical URLs, Open Graph tags, the sitemap and the RSS
          # feed all follow it automatically.
          if [[ -f public/CNAME ]]; then
            DOMAIN="$(tr -d '[:space:]' < public/CNAME)"
            echo "base_path=" >> "$GITHUB_OUTPUT"
            echo "site_url=https://${DOMAIN}" >> "$GITHUB_OUTPUT"
            echo "Using custom domain: ${DOMAIN}"
          elif [[ "$REPO" == *.github.io ]]; then
            # A repo named <user>.github.io serves from the domain root.
            echo "base_path=" >> "$GITHUB_OUTPUT"
            echo "site_url=https://${REPO}" >> "$GITHUB_OUTPUT"
          else
            # Any other repo serves from /<repo>, which Next.js needs as basePath.
            echo "base_path=/${REPO}" >> "$GITHUB_OUTPUT"
            echo "site_url=https://${OWNER}.github.io/${REPO}" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint, typecheck and check MDX
        run: |
          npm run lint
          npm run typecheck
          npm run check:mdx

      # The two realm passphrases scripts/encrypt-premium.mjs uses are no
      # longer static secrets: access-worker/ owns them, rotating each one
      # monthly, so every build has to ask it for whatever is current rather
      # than reading a fixed value. See access-worker/README.md.
      - name: Fetch current realm keys
        id: realm_keys
        env:
          ACCESS_WORKER_URL: ${{ secrets.ACCESS_WORKER_URL }}
          ACCESS_WORKER_CI_TOKEN: ${{ secrets.ACCESS_WORKER_CI_TOKEN }}
        run: |
          for REALM in learn sdv; do
            KEY="$(curl -sS -f \
              -H "Authorization: Bearer ${ACCESS_WORKER_CI_TOKEN}" \
              "${ACCESS_WORKER_URL}/internal/current-key?realm=${REALM}" | \
              node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0,"utf8")).key)')"
            echo "::add-mask::${KEY}"
            echo "${REALM}_key=${KEY}" >> "$GITHUB_OUTPUT"
          done

      - name: Build static site
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.site_url }}
          NEXT_PUBLIC_ACCESS_WORKER_URL: ${{ secrets.ACCESS_WORKER_URL }}
          # scripts/encrypt-premium.mjs refuses to run without both of these —
          # better a failed build than a publish that ships locked articles in
          # plain text because a key went missing.
          PREMIUM_PASSPHRASE_LEARN: ${{ steps.realm_keys.outputs.learn_key }}
          PREMIUM_PASSPHRASE_SDV: ${{ steps.realm_keys.outputs.sdv_key }}
        run: npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./out
          # v4 began excluding dotfiles from the artifact. public/.nojekyll is
          # one, and losing it risks Pages running Jekyll over the output,
          # which would ignore every _next/ directory and take the site down.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
